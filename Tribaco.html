<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h2>REGISTRATION FORM</h2>
<form action="login.php" method="POST">

    <label for="name">Name:</label><br>
    <input
        type="name" maxlength="50"
        id="name" maxlength="50"
        name="name"
        required>
    <br><br>

    <label for="email">Email:</label><br>
    <input 
        type="email" 
        id="email" 
        name="email" 
        required>
    <br><br>

    <label for="gender">Gender:</label><br>

    <input
        type="radio" 
        id="male" 
        name="gender"
        value="male"
        required>
    <label for="male">Male</label>

    <input
        type="radio"
        id="female"
        name="gender"
        value="female"
        required>
    <label for="female">Female</label>

    <br><br>

    <label for="password">Password:</label><br>
    <input
        type="password" maxlength="20"
        id="password" 
        name="password" 
        required>
    <br><br>

    <label for="interests">Interests:</label><br>

    <input
        type="checkbox"
        id="sports"
        name="interests"
        value="sports">
    <label for="sports">Sports</label>

    <input
        type="checkbox"
        id="music"
        name="interests"
        value="music">
    <label for="music">Music</label>

    <input
        type="checkbox"
        id="reading"
        name="interests"
        value="reading">
    <label for="reading">Reading</label>

    <br><br>

    <label for="Short Bio">Short Bio:</label><br>
    <input
        type="text" maxlength="200"
        id="short_bio"
        name="short_bio"
        rows="4"
        cols="50"
        required>
    <br><br>

    <button type="submit">SUBMIT</button>
</form>
</body>
</html>
